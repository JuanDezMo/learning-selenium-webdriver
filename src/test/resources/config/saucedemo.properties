# Configuración de la aplicación saucedemo
base.url=https://www.saucedemo.com

# Usuarios de prueba (son los usuarios públicos de demostración de saucedemo).
# En los escenarios se usa el alias: "standard" o "locked".
# Para cambiar un usuario o agregar otro, solo se edita este archivo.
user.standard.name=standard_user
user.standard.password=secret_sauce
