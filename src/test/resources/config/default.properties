# Valores comunes a todas las aplicaciones y ambientes.
# Se pueden sobrescribir en {app}.properties, {app}-{env}.properties,
# con variables de entorno o con -Dpropiedad=valor.

# Navegador: chrome | firefox
browser=chrome
# Modo de ejecución: local | remote
mode=local
# URL del servidor de navegadores cuando mode=remote
remote.url=http://localhost:4444
# Ejecutar sin ventana visible
headless=false
# Tiempo máximo de espera explícita, en segundos
timeout.seconds=10
