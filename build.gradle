plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

// Versiones fijadas en un solo lugar para que sean fáciles de actualizar
ext {
    seleniumVersion = '4.50.0'
    cucumberVersion = '7.34.9'
    junitVersion    = '5.14.4'
    slf4jVersion    = '2.0.17'
    allureVersion   = '2.35.5'
}

group = 'co.com.learningseleniumwebdriver'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"

    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-picocontainer:${cucumberVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"

    testImplementation "io.qameta.allure:allure-cucumber7-jvm:${allureVersion}"
}

// Reporte Allure: los resultados quedan en build/allure-results y el reporte HTML en build/reports/allure-report
allure {
    adapter {
        // El adaptador de Cucumber se declara arriba; aquí solo se fija la versión de Allure
        autoconfigure = false
        aspectjWeaver = true
    }
}

// Cada reporte se genera desde cero (Allure se niega a sobrescribir una carpeta existente)
tasks.matching { it.name == 'allureReport' }.configureEach {
    doFirst { delete layout.buildDirectory.dir('reports/allure-report') }
}

// Chequeo de que cada escenario tenga la etiqueta @component o @e2e
apply from: 'gradle/scenario-tags.gradle'

// Aplicación a probar: -Dapp=<nombre> (por defecto saucedemo). Cada aplicación tiene su runner
// co.com.learningseleniumwebdriver.runner.Run<Aplicacion>Test y solo se ejecuta el de la aplicación elegida.
def selectedApp = (gradle.startParameter.systemPropertiesArgs['app'] ?: 'saucedemo').toLowerCase()
// Paralelismo: -Dparallel=true activa la ejecución concurrente de escenarios y -Dthreads=N fija los hilos (por defecto 2)
def parallelEnabled = (gradle.startParameter.systemPropertiesArgs['parallel'] ?: 'false').toBoolean()
def parallelThreads = gradle.startParameter.systemPropertiesArgs['threads'] ?: '2'
def selectedRunner = "Run${selectedApp.capitalize()}Test"
def otherRunners = fileTree('src/test/java/co/com/learningseleniumwebdriver/runner').matching { include 'Run*Test.java' }
        .files.collect { it.name - '.java' }.findAll { it != selectedRunner }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Pasa a las pruebas los -D indicados en la línea de comandos (por ejemplo -Dbrowser=firefox)
    systemProperties(gradle.startParameter.systemPropertiesArgs)
    // Paralelismo a nivel de escenario (Cucumber sobre JUnit Platform)
    if (parallelEnabled) {
        systemProperty 'cucumber.execution.parallel.enabled', 'true'
        systemProperty 'cucumber.execution.parallel.config.strategy', 'fixed'
        systemProperty 'cucumber.execution.parallel.config.fixed.parallelism', parallelThreads
        systemProperty 'cucumber.execution.parallel.config.fixed.max-pool-size', parallelThreads
    }
    // Solo corre el runner de la aplicación elegida
    otherRunners.each { exclude "**/${it}.class" }
    // Antes de ejecutar nada se valida que los escenarios estén bien etiquetados
    dependsOn 'checkScenarioTags'
    // Cada ejecución empieza con resultados de Allure limpios para no mezclar corridas
    doFirst { delete layout.buildDirectory.dir('allure-results') }
    // Muestra el resultado de cada prueba en la consola
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

// test: pruebas unitarias del proyecto + todos los escenarios de la aplicación elegida
// componentTest / e2eTest: solo los escenarios de ese tipo (sin pruebas unitarias)
['component', 'e2e'].each { type ->
    tasks.register("${type}Test", Test) {
        group = 'verification'
        description = "Ejecuta solo los escenarios @${type} de la aplicación elegida (-Dapp)"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/Run*Test.class'
        systemProperty 'cucumber.filter.tags', "@${type}"
    }
}

// functionalTest: todos los escenarios (componente y E2E) de la aplicación elegida, sin pruebas unitarias
tasks.register('functionalTest', Test) {
    group = 'verification'
    description = 'Ejecuta todos los escenarios (@component y @e2e) de la aplicación elegida (-Dapp)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/Run*Test.class'
}
